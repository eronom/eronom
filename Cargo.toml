[package]
name = "eronom"
version = "0.9.2"
edition = "2024"
default-run = "eronom"

[lib]
name = "eronom"
path = "libs/erm/lib.rs"


[dependencies]
anyhow = "1.0.102"
fnv = "1.0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
regex = "1"
clap = { version = "4.6.1", features = ["derive"] }
toml = "0.8.19"
ureq = "3.3.0"



[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
