To resolve the performance bottlenecks and make Eronom's sequential fetches faster than Bun, we replaced the external curl process spawning with a native Rust HTTP client using reqwest (configured with rustls-tls to avoid system OpenSSL dependencies).

What We Did
Added reqwest to Cargo.toml: Enabled the blocking and rustls-tls features.
Replaced Subprocess calls: Modified native_fetch_async, native_fetch_sync, and native_fetch_evented in src/vm/er_http.rs to use reqwest.
Implemented Connection Pooling: Defined a global static reqwest::blocking::Client initialized via std::sync::OnceLock. This enables full HTTP/2 multiplexing, connection pooling, and TLS session reuse across all background thread invocations.
Compiled and Verified: Rebuilt Eronom in release mode and verified that all existing tests pass successfully.
