[workspace]
members = [
    ".",
    "crates/eronom-core",
    "crates/eronom-frontend",
    "crates/eronom-net",
    "crates/eronom-vm",
    "crates/eronom-runner",
    "crates/eronom-cranelift",
    "crates/eronom-clap",
    "crates/eronom-clap-macros",
]
default-members = ["."]

[package]
name = "eronom"
version = "0.9.4"
edition = "2024"
default-run = "eronom"

[lib]
name = "eronom"
path = "src/lib.rs"


[dependencies]
eronom-core = { path = "crates/eronom-core" }
eronom-frontend = { path = "crates/eronom-frontend" }
eronom-net = { path = "crates/eronom-net" }
eronom-vm = { path = "crates/eronom-vm" }
eronom-clap = { path = "crates/eronom-clap" }
anyhow = "1.0.102"
fnv = "1.0.7"
regex = "1"
toml = "0.8.19"
object = { version = "0.40.0", features = ["write", "std"] }
target-lexicon = "0.13.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
