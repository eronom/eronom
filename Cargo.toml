[package]
name = "eronom"
version = "0.1.0"
edition = "2024"
default-run = "eronom"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
fnv = "1.0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tiny_http = "0.12.0"
regex = "1"
indexmap = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
