[package]
name = "eronom-cranelift"
version = "0.9.4"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
eronom = { path = "../.." }
eronom-clap = { path = "../eronom-clap" }
anyhow = "1.0.102"
target-lexicon = "0.13.5"
object = { version = "0.40.0", features = ["write", "std"] }
cranelift-codegen = { path = "../../deps/cranelift/codegen", features = ["all-arch", "std"] }
cranelift-frontend = { path = "../../deps/cranelift/frontend" }
cranelift-module = { path = "../../deps/cranelift/module" }
cranelift-object = { path = "../../deps/cranelift/object" }
cranelift-jit = { path = "../../deps/cranelift/jit" }

[[bin]]
name = "eronom-cranelift"
path = "src/main.rs"

[lib]
name = "eronom_cranelift"
path = "src/lib.rs"
