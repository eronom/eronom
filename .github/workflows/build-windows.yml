name: Build Windows Native

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (release or debug)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - feat/native-aot-codegen
    paths:
      - "src/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build Windows Binaries
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.profile }}" -eq "debug") {
            cargo build --target x86_64-pc-windows-msvc --bin eronom --bin eronom-runner
            $buildDir = "target/x86_64-pc-windows-msvc/debug"
          } else {
            cargo build --release --target x86_64-pc-windows-msvc --bin eronom --bin eronom-runner
            $buildDir = "target/x86_64-pc-windows-msvc/release"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$buildDir/eronom.exe" -Destination dist/
          Copy-Item "$buildDir/eronom-runner.exe" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath dist/eronom-windows-x64.zip -Force

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: eronom-windows-x64
          path: |
            dist/eronom.exe
            dist/eronom-runner.exe
            dist/eronom-windows-x64.zip
          if-no-files-found: error
