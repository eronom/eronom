name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.2, v1.0.0, canary)"
        required: true
        type: string
      is-latest:
        description: "Mark this release as the latest official release"
        type: boolean
        default: true
      prerelease:
        description: "Mark this release as a pre-release"
        type: boolean
        default: false
      build-binaries:
        description: "Build and attach multi-platform native binaries"
        type: boolean
        default: true
      release-extension:
        description: "Build and package the VS Code extension (.vsix)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  IS_LATEST: ${{ (github.event.inputs.is-latest || (github.event.release && !github.event.release.prerelease)) && 'true' || 'false' }}
  IS_PRERELEASE: ${{ (github.event.inputs.prerelease || (github.event.release && github.event.release.prerelease)) && 'true' || 'false' }}

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. COMPILE MULTI-PLATFORM NATIVE BINARIES
  # =========================================================================
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build-binaries == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive-suffix: linux-x64
            binary-name: eronom

          # Linux aarch64 (ARM64)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive-suffix: linux-arm64
            binary-name: eronom

          # macOS Intel (x86_64)
          - os: macos-14
            target: x86_64-apple-darwin
            archive-suffix: darwin-x64
            binary-name: eronom

          # macOS Apple Silicon (arm64)
          - os: macos-14
            target: aarch64-apple-darwin
            archive-suffix: darwin-arm64
            binary-name: eronom

          # Windows x86_64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive-suffix: windows-x64
            binary-name: eronom.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ clang libssl-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging on Unix (Linux & macOS) -> .tar.gz
      - name: Package Unix Archive (.tar.gz)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE_NAME="eronom-${{ env.RELEASE_TAG }}-${{ matrix.archive-suffix }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary-name }}" staging/
          cp LICENSE staging/ 2>/dev/null || true
          cp README.md staging/ 2>/dev/null || true

          tar -czvf "$ARCHIVE_NAME" -C staging .
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

          mkdir -p dist
          mv "$ARCHIVE_NAME" dist/
          mv "$ARCHIVE_NAME.sha256" dist/

      # Packaging on Windows -> .zip
      - name: Package Windows Archive (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "eronom-${{ env.RELEASE_TAG }}-${{ matrix.archive-suffix }}.zip"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary-name }}" -Destination staging/
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination staging/ }
          if (Test-Path README.md) { Copy-Item README.md -Destination staging/ }

          Compress-Archive -Path staging/* -DestinationPath $ARCHIVE_NAME -Force
          $hash = (Get-FileHash -Path $ARCHIVE_NAME -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE_NAME" | Out-File -FilePath "$ARCHIVE_NAME.sha256" -Encoding ASCII

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item $ARCHIVE_NAME -Destination dist/
          Move-Item "$ARCHIVE_NAME.sha256" -Destination dist/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eronom-${{ matrix.archive-suffix }}
          path: dist/*
          if-no-files-found: error

  # =========================================================================
  # 2. PACKAGE VS CODE EXTENSION (.vsix)
  # =========================================================================
  build-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release-extension == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eronom-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: eronom-extension
        run: npm ci

      - name: Compile extension
        working-directory: eronom-extension
        run: npm run package

      - name: Package VSIX
        working-directory: eronom-extension
        run: |
          VSIX_NAME="eronom-extension-${{ env.RELEASE_TAG }}.vsix"
          npx @vscode/vsce package -o "../$VSIX_NAME" --no-git-tag-version

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eronom-vscode-extension
          path: eronom-extension-*.vsix
          if-no-files-found: error

      # Optional: Publish to VS Code Marketplace if token is provided
      - name: Publish to VS Code Marketplace
        if: ${{ env.IS_PRERELEASE == 'false' }}
        working-directory: eronom-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish -p "$VSCE_PAT"
          else
            echo "VSCE_PAT secret not provided, skipping Marketplace publish."
          fi

      # Optional: Publish to Open VSX if token is provided
      - name: Publish to Open VSX Registry
        if: ${{ env.IS_PRERELEASE == 'false' }}
        working-directory: eronom-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret not provided, skipping Open VSX publish."
          fi

  # =========================================================================
  # 3. CREATE GITHUB RELEASE & ATTACH ASSETS
  # =========================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-extension]
    if: always() && !cancelled() && (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ env.RELEASE_TAG }}^" 2>/dev/null || git tag --sort=-creatordate | grep -v "${{ env.RELEASE_TAG }}" | head -n 1 || echo "")
          DATE=$(date +%Y-%m-%d)
          CLEAN_TAG="${{ env.RELEASE_TAG }}"
          CLEAN_TAG="${CLEAN_TAG#v}"
          echo "## ${CLEAN_TAG} (${DATE})" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          else
            git log -n 25 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md
          cat release_notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Aggregate release archives
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          echo "Release assets ready:"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_LATEST == 'true' && 'true' || 'false' }}
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
