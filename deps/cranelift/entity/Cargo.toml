[package]
authors = ["The Cranelift Project Developers"]
name = "cranelift-entity"
version = "0.139.0-dev"
description = "Data structures using entity references as mapping keys"
license = "Apache-2.0 WITH LLVM-exception"
documentation = "https://docs.rs/cranelift-entity"
repository = "https://github.com/bytecodealliance/wasmtime"
categories = ["no-std"]
keywords = ["entity", "set", "map"]
edition = "2024"
rust-version = "1.95.0"

[dependencies]
cranelift-bitset = { path = "../bitset", version = "0.139.0-dev" }
serde = { version = "1.0.228", default-features = false, features = ["alloc"], optional = true }
serde_derive = { version = "1.0.228", optional = true }
wasmtime-core = { path = "../core", version = "0.139.0-dev", package = "wasmtime-internal-core" }

[features]
enable-serde = ["serde", "serde_derive", "cranelift-bitset/enable-serde"]
