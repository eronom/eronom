[package]
authors = ["The Cranelift Project Developers"]
name = "cranelift-codegen"
version = "0.139.0-dev"
description = "Low-level code generator library"
license = "Apache-2.0 WITH LLVM-exception"
documentation = "https://docs.rs/cranelift-codegen"
repository = "https://github.com/bytecodealliance/wasmtime"
categories = ["no-std"]
keywords = ["compile", "compiler", "jit"]
build = "build.rs"
edition = "2024"
rust-version = "1.95.0"

[package.metadata.docs.rs]
# Ask Cargo to build docs with the feature `all-arch`
features = ["all-arch"]

[dependencies]
anyhow = { version = "1.0.103", default-features = false, features = ['std'], optional = true }
bumpalo = "3.20.4"
capstone = { version = "0.14.0", default-features = false, optional = true }
cranelift-assembler-x64 = { path = "../assembler-x64", version = "0.139.0-dev" }
cranelift-codegen-shared = { path = "./shared", version = "0.139.0-dev" }
cranelift-entity = { path = "../entity", version = "0.139.0-dev" }
cranelift-bforest = { path = "../bforest", version = "0.139.0-dev" }
cranelift-bitset = { path = "../bitset", version = "0.139.0-dev" }
cranelift-control = { path = "../control", version = "0.139.0-dev" }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
target-lexicon = "0.13.5"
log = { version = "0.4.28", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc"], optional = true }
serde_derive = { version = "1.0.228", optional = true }
pulley-interpreter = { path = "../pulley", version = "0.139.0-dev", optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
gimli = { version = "0.33.0", default-features = false, features = ["write"], optional = true }
smallvec = { version = "1.15.1", features = ["union"] }
regalloc2 = { version = "0.15.3", features = ["checker"] }
souper-ir = { version = "2.1.0", optional = true }
sha2 = { version = "0.10.2", default-features = false, optional = true }
rustc-hash = { version = "2.1.1", default-features = false }
wasmtime-core = { path = "../core", version = "0.139.0-dev", package = "wasmtime-internal-core" }
libm = "0.2.16"
# It is a goal of the cranelift-codegen crate to have minimal external dependencies.
# Please don't add any unless they are essential to the task of creating binary
# machine code. Integration tests that need external dependencies can be
# accommodated in `tests`.

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
similar = "3.1.1"
env_logger = "0.11.5"
proptest = "1.11.0"
mutatis = { version = "0.5.2", features = ["alloc", "derive", "check"] }

[build-dependencies]
cranelift-codegen-meta = { path = "meta", version = "0.139.0-dev" }
cranelift-isle = { path = "../isle/isle", version = "=0.139.0-dev" }

[features]
default = ["std", "unwind", "host-arch", "timing"]

# The "std" feature enables use of libstd.
std = ["serde?/std", "rustc-hash/std", "gimli/std", "cranelift-control/fuzz"]

# The "core" feature used to enable a hashmap workaround, but is now deprecated
# (now we always use hashbrown). The feature remains for backward compatibility.
core = []

# Enable the `to_capstone` method on TargetIsa, for constructing a Capstone
# context, and the `disassemble` method on `MachBufferFinalized`.
disas = ["anyhow", "capstone"]

# Enables detailed logging which can be somewhat expensive.
trace-log = ["regalloc2/trace-log"]

# By default, an ISLE term is compiled into a single Rust function, but it can be
# significantly inefficient for large terms (e.g. `simplify` with hundreds of rules).
# This is because the generated Rust code for such terms is large, and `rustc` takes quadratically longer to compile huge functions.
# This feature splits large match arms in such ISLE terms into closures, for compiling ISLE terms more efficiently.
# However, this can degrade Cranelift compilation times, introducing ABI boundaries between the closures.
# Therefore, we recommend enabling this feature only for debugging/development purposes.
isle-split-match = []

# This enables unwind info generation functionality.
unwind = ["gimli"]

# ISA targets for which we should build.
# If no ISA targets are explicitly enabled, the ISA target for the host machine is enabled.
x86 = []
arm64 = []
s390x = []
riscv64 = []
pulley = ["pulley-fallback"]

# Enable the Pulley ISA targets only when the target machine has no native
# Cranelift backend. Note that pulley deps are still pulled in unconditionally,
# but they're unused should the target machine have a native backend.
pulley-fallback = [
    "dep:pulley-interpreter",
    "pulley-interpreter/encode",
    "pulley-interpreter/disas",
    "cranelift-codegen-meta/pulley",
]
# Enable the ISA target for the host machine
host-arch = []

# Option to enable all architectures.
all-arch = ["all-native-arch", "pulley"]

# Option to enable all architectures that correspond to an actual native target
# (that is, exclude Pulley).
all-native-arch = ["x86", "arm64", "s390x", "riscv64"]

# For dependent crates that want to serialize some parts of cranelift
enable-serde = [
    "serde",
    "serde_derive",
    "cranelift-entity/enable-serde",
    "cranelift-bitset/enable-serde",
    "regalloc2/enable-serde",
    "hashbrown/serde",
    "smallvec/serde",
]

# Enable the incremental compilation cache for hot-reload use cases.
incremental-cache = ["enable-serde", "postcard", "sha2"]

# Enable support for the Souper harvester.
souper-harvest = ["souper-ir", "souper-ir/stringify"]

# Report any ISLE errors in pretty-printed style.
isle-errors = ["cranelift-isle/fancy-errors"]

# Enable tracking how long passes take in Cranelift.
#
# Enabled by default.
timing = []
