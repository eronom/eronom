[package]
name = "cranelift-module"
version = "0.139.0-dev"
authors = ["The Cranelift Project Developers"]
description = "Support for linking functions and data with Cranelift"
repository = "https://github.com/bytecodealliance/wasmtime"
documentation = "https://docs.rs/cranelift-module"
categories = ["no-std"]
license = "Apache-2.0 WITH LLVM-exception"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
cranelift-codegen = { path = "../codegen", version = "0.139.0-dev" }
cranelift-control = { path = "../control", version = "0.139.0-dev" }
hashbrown = { version = "0.17", default-features = false }
anyhow = { version = "1.0.103", default-features = false, features = ['std'] }
serde = { version = "1.0.228", default-features = false, features = ["alloc"], optional = true }
serde_derive = { version = "1.0.228", optional = true }

[features]
default = ["std"]
std = ["cranelift-codegen/std"]
# The "core" feature no longer does anything here either: hashbrown is now an
# unconditional dependency. Kept, empty, for backward compatibility.
core = []

# For dependent crates that want to serialize some parts of cranelift
enable-serde = ["serde", "serde_derive", "cranelift-codegen/enable-serde"]
