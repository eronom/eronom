[package]
name = "wasmtime-internal-jit-icache-coherence"
version = "0.139.0-dev"
authors = ["The Cranelift Project Developers"]
description = "INTERNAL: Utilities for JIT icache maintenance"
documentation = "https://docs.rs/jit-icache-coherence"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wasmtime"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
wasmtime-core = { path = "../core", version = "0.139.0-dev", package = "wasmtime-internal-core" }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
]

[target.'cfg(all(not(miri), target_arch = "aarch64", any(target_os = "linux", target_os = "android")))'.dependencies]
libc = { version = "0.2.190", default-features = true }

[target.'cfg(all(not(miri), target_arch = "riscv64", target_os = "linux"))'.dependencies]
libc = { version = "0.2.190", default-features = true }

# For the test that runs rewritten code.
[target.'cfg(all(not(miri), target_arch = "aarch64", any(target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "macos")))'.dev-dependencies]
libc = { version = "0.2.190", default-features = true }

[features]
# Most modern CPUs are SMP (multicore). However, when only one core is present,
# some aspects of coherence are much cheaper. For example, RISC-V can use
# one instruction `fence.i` rather than a syscall that invokes all other cores.
# This feature enables such optimizations, but the resulting program will *only*
# be safe to run on one-core systems.
one-core = []
