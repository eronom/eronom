[package]
authors = ["The Pulley Project Developers"]
description = "The Pulley interpreter, its bytecode definition, encoder, decoder, and etc..."
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0 WITH LLVM-exception"
name = "pulley-interpreter"
readme = "./README.md"
repository = "https://github.com/bytecodealliance/wasmtime/tree/main/pulley"
version = "0.139.0-dev"

[dependencies]
arbitrary = { version = "1.4.2", optional = true }
cranelift-bitset = { path = "../bitset", version = "0.139.0-dev" }
wasmtime-core = { path = "../core", version = "0.139.0-dev", package = "wasmtime-internal-core", optional = true }
anyhow = { version = "1.0.103", default-features = false, optional = true }
pulley-macros = { path = "macros", version = "0.139.0-dev", optional = true }

[features]
std = ['wasmtime-core?/std']
arbitrary = ["dep:arbitrary", "arbitrary/derive", "std", "cranelift-bitset/arbitrary"]
encode = []
decode = []
disas = ["decode"]
interp = ["decode", "encode", "dep:wasmtime-core", "dep:pulley-macros"]
profile = ['std', 'dep:anyhow']

[package.metadata.docs.rs]
all-features = true
